name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    # Slika s Visual Studiom 2022, jer projekt koristi skup alata v143.
    runs-on: windows-2022

    steps:
      - name: Dohvat izvornog koda
        uses: actions/checkout@v4

      - name: Priprema MSBuild-a
        uses: microsoft/setup-msbuild@v2

      - name: Prevodenje (Release x64)
        run: msbuild ProcMon.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal

      - name: Spremanje izvrsne datoteke
        uses: actions/upload-artifact@v4
        with:
          name: ProcMon-Release-x64
          path: x64/Release/ProcMon.exe
